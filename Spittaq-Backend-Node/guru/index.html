<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk · Portal Guru SMPIT At-Taqwa Surabaya</title><link rel="stylesheet" href="/guru/css/auth.css"></head><body data-role="teacher"><main class="auth-shell"><a class="brand" href="/guru/"><img class="brand-logo" src="/guru/images/at-taqwa-logo.jpg" alt="Logo SMPIT At-Taqwa Surabaya"><span><b>SMPIT At-Taqwa Surabaya</b><small>Portal Guru</small></span></a><section class="auth-card"><p class="eyebrow">AKUN GURU</p><h1 id="formTitle">Masuk ke Portal Guru</h1><p class="intro">Kelola pengumpulan tugas siswa dengan akun guru.</p><form id="authForm"><label id="nameField" hidden>Nama guru<input name="name" maxlength="60" autocomplete="name"></label><label id="classField" hidden>Kelas<input name="className" maxlength="30"></label><label>Username<input name="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9._-]+" autocomplete="username" required></label><label>Kata sandi<input name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label><button class="primary" type="submit" id="submitButton">Masuk</button><p class="message" id="message" role="status"></p></form><p class="switch-line"><span id="switchText">Belum punya akun?</span> <button id="switchMode" type="button">Daftar akun guru</button></p></section><a class="other-portal" href="/">Masuk sebagai siswa →</a></main><script src="/guru/js/auth.js" defer></script></body></html>
