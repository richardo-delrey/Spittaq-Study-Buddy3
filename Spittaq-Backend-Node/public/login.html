<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk · SMPIT At-Taqwa Surabaya</title><link rel="stylesheet" href="css/auth.css"></head>
<body data-role="student"><main class="auth-shell"><a class="brand" href="/"><img class="brand-logo" src="images/spittaq-logo.jpg" alt="Logo SMPIT At-Taqwa Surabaya"><span><b>SMPIT At-Taqwa Surabaya</b><small>Study Buddy Siswa</small></span></a><section class="auth-card"><p class="eyebrow">AKUN SISWA</p><h1 id="formTitle">Masuk ke Study Buddy</h1><p class="intro">Simpan tugas dan pengumpulanmu dalam akun sendiri.</p><form id="authForm"><label id="nameField" hidden>Nama lengkap<input name="name" maxlength="60" autocomplete="name"></label><label id="classField" hidden>Kelas<input name="className" maxlength="30" placeholder="Contoh: Kelas 9A"></label><label>Username<input name="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9._-]+" autocomplete="username" required></label><label>Kata sandi<input name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label><button class="primary" type="submit" id="submitButton">Masuk</button><p class="message" id="message" role="status"></p></form><p class="switch-line"><span id="switchText">Belum punya akun?</span> <button id="switchMode" type="button">Daftar akun siswa</button></p></section><a class="other-portal" href="/guru/">Masuk sebagai guru →</a></main><script src="js/auth.js" defer></script></body></html>
